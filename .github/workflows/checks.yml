name: Checks

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: npm ci
      - run: deno check supabase/functions/monitor/index.ts
      - run: npm run test
      - run: npm run build
